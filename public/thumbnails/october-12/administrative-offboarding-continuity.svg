  <path d="M0 0h1200v630H0Z" fill="#eef4ff"/><path d="M0 0h650v630H0Z" fill="#0b1736"/>
  <text x="60" y="70" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f2b84b">OFFBOARDING CONTINUITY</text>
  <text x="60" y="162" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#fff"><tspan x="60">Close Access</tspan><tspan x="60" dy="54">and Transfer Work</tspan></text>
  <g transform="translate(66 326)"><rect width="222" height="156" rx="22" fill="#173b78"/><circle cx="64" cy="63" r="28" fill="#f2b84b"/><path d="M30 123q34-48 68 0Z" fill="#f2b84b"/><path d="M123 53h64M123 96h45" stroke="#9dbaf7" stroke-width="11" stroke-linecap="round"/></g>
