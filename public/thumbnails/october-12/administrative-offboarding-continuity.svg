<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Close Administrative Access and Work at Offboarding</title>
  <desc id="desc">Editorial illustration of access being locked while active work transfers safely to a new owner.</desc>
