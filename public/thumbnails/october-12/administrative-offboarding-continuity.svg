  <g transform="translate(692 90)"><rect width="418" height="458" rx="30" fill="#fff"/><rect x="74" y="190" width="270" height="196" rx="25" fill="#2f6fed"/><path d="M131 190v-58a78 78 0 0 1 156 0v58" fill="none" stroke="#173b78" stroke-width="26"/><circle cx="209" cy="268" r="28" fill="#f2b84b"/><path d="M209 292v42" stroke="#f2b84b" stroke-width="18" stroke-linecap="round"/><circle cx="342" cy="404" r="62" fill="#54c7c1"/><path d="m313 404 20 20 39-48" fill="none" stroke="#0b1736" stroke-width="13"/></g>
  <text x="60" y="570" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#9dbaf7">TRANSFER • REVOKE • CONFIRM</text>
