  <circle cx="175" cy="315" r="230" fill="#173b78"/><circle cx="175" cy="315" r="142" fill="#2f6fed"/>
  <g fill="#f7f3e8"><circle cx="122" cy="284" r="26"/><circle cx="228" cy="284" r="26"/><path d="M76 360q46-66 92 0ZM182 360q46-66 92 0Z"/></g>
  <path d="M344 315h104M430 315l74-116M430 315l74 116" fill="none" stroke="#f2b84b" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(504 122)"><rect width="238" height="154" rx="22" fill="#f7f3e8"/><path d="M40 52h158M40 91h108" stroke="#2f6fed" stroke-width="12" stroke-linecap="round"/><circle cx="196" cy="126" r="42" fill="#54c7c1"/><path d="m178 126 13 13 24-29" fill="none" stroke="#0b1736" stroke-width="9"/></g>
