  <text x="790" y="82" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f2b84b">MEETING RECORDS</text>
  <text x="790" y="172" font-family="Arial,sans-serif" font-size="41" font-weight="800" fill="#fff"><tspan x="790">Separate Meeting</tspan><tspan x="790" dy="53">Decisions From</tspan><tspan x="790" dy="53">Action Tracking</tspan></text>
  <text x="790" y="486" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#9dbaf7">DECISIONS STAY FIXED</text><text x="790" y="525" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#54c7c1">ACTIONS KEEP MOVING</text>
